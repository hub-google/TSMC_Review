<title>TSMC 職域考核預警｜區域中心四象限</title>
<style>
:root{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#1a2740;background:#f3f6fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}
:root{--blue:#2554a5;--navy:#12213e;--muted:#64748b;--line:#e3e9f1;--red:#dc594b;--amber:#d89922;--teal:#238e7a;--violet:#6962b6}
.shell{max-width:1540px;padding:36px 36px 70px;margin:auto}
header{background:linear-gradient(110deg,#142a50,#21477f 72%,#286785);color:white;border-radius:23px;padding:32px 38px;box-shadow:0 22px 38px #193b6e19;position:relative;overflow:hidden}header:after{content:"";position:absolute;width:380px;height:380px;border:1px solid #ffffff20;border-radius:50%;right:-100px;top:-220px;box-shadow:0 0 0 60px #ffffff08,0 0 0 130px #ffffff07;pointer-events:none}
.kicker{letter-spacing:.18em;font-size:11px;font-weight:800;color:#acdbf0}.headrow{display:flex;align-items:end;justify-content:space-between;gap:22px;flex-wrap:wrap}h1{margin:11px 0;font-weight:850;font-size:clamp(24px,2.3vw,37px);letter-spacing:.01em}header p{margin:0;color:#d0e0f2;font-size:14px;line-height:1.9}.head-tag{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;background:#ffffff1f;border:1px solid #ffffff26;border-radius:999px;font-size:12px;color:#eaf5ff;position:relative}.head-tag .pulse{width:8px;height:8px;background:#7de0ae;border-radius:50%}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 18px;flex-wrap:wrap}.topline h2{font-size:18px;margin:0;color:#21314c}.update{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:white;border:1px solid #e7ecf2;border-radius:17px;padding:19px 21px;box-shadow:0 5px 16px #34486108}.stat small{color:#718199;font-weight:650}.stat strong{display:block;font-variant-numeric:tabular-nums;font-size:31px;color:#142b4e;margin-top:8px}.stat strong em{font-style:normal;font-size:14px;margin-left:6px;color:#8897a8;font-weight:500}.stat.warn strong{color:#ba483c}.stat .sub{font-size:12px;margin-top:5px;color:#8a98a8}
.toolbar{margin:22px 0 17px;padding:16px;background:white;border:1px solid var(--line);border-radius:17px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid transparent;background:#f1f4f9;border-radius:10px;padding:9px 15px;color:#52617a;font-size:13px;font-weight:750}.tab.on{background:var(--navy);color:#fff;box-shadow:0 4px 12px #1c35562a}.search{padding:10px 14px;border:1px solid #dfe6ef;border-radius:10px;min-width:210px;color:#334155;background:#fff}.search::placeholder{color:#a2aec1}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#718098;font-size:12px}.legend b{font-weight:700;color:#57667c}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:4px}.q1{--q:#268a79;--qbg:#f1fbf8}.q2{--q:#d79b32;--qbg:#fffaf0}.q3{--q:#d35e55;--qbg:#fff6f3}.q4{--q:#7772bd;--qbg:#f8f7fe}
.explain{color:#718198;font-size:12px;margin:4px 3px 18px;line-height:1.8}.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.dashboard.single{display:block}.panel{background:#fff;padding:22px;border-radius:19px;border:1px solid var(--line);box-shadow:0 5px 18px #36485e0a;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panelhead h3{font-size:18px;margin:0;font-weight:800;color:#172b49}.panelhead .count{font-size:12px;color:#8291a4;margin-top:5px}.expand{border:1px solid #e0e8f4;background:#f7f9fc;color:#2b598e;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700}
.quad-layout{display:grid;grid-template-columns:33px minmax(0,1fr);grid-template-rows:auto 27px;position:relative}.yaxis{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:center;align-items:center;gap:9px;color:#64748b;font-size:12px;font-weight:700}.axis-arrow{color:#91a2b7;font-size:18px}.xaxis{grid-column:2;text-align:center;padding-top:6px;color:#64748b;font-size:12px;font-weight:700}.quad-grid{grid-column:2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;min-height:465px;border:2px solid #d9e1eb;border-radius:12px;overflow:hidden;background:#fff}
.quad{position:relative;min-width:0;min-height:226px;background:var(--qbg);border-right:1px dashed #aab7ca;border-bottom:1px dashed #aab7ca}.quad:nth-child(even){border-right:0}.quad:nth-child(n+3){border-bottom:0}.quad .qh{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--q);font-size:12px;font-weight:850;padding:12px 13px;position:relative;z-index:1}.qh span{white-space:nowrap}.qh small{display:inline-grid;place-items:center;border-radius:6px;background:#ffffffc9;padding:3px 8px;font-weight:800;color:var(--q)}.quad-empty{color:#a0aebd;font-size:11px;text-align:center;position:absolute;top:56%;left:0;right:0}
.dot{position:absolute;transform:translate(-50%,-30%);background:transparent;border:0;display:flex;align-items:center;flex-direction:column;gap:3px;min-width:43px;max-width:98px;padding:4px 2px;border-radius:8px;color:#344358;transition:background .15s,transform .15s;z-index:2}.dot:hover,.dot:focus-visible{background:#ffffffdf;transform:translate(-50%,-35%);z-index:6}.dot .circle{width:13px;height:13px;border-radius:50%;background:var(--q);box-shadow:0 0 0 4px #ffffffbc,0 2px 4px #1d294130}.dot .name{font-size:11px;line-height:1.15;max-width:95px;text-align:center;overflow-wrap:anywhere;font-weight:750}.dot.is-search-miss{opacity:.12}.dot.active{background:white;box-shadow:0 0 0 2px var(--q);z-index:5}.dot .factory-count{font-size:9px;color:#82909f}.single .quad-grid{min-height:550px}.single .quad{min-height:270px}.single .dot .name{font-size:12px}
.region-foot{border-top:1px solid #edf0f5;margin-top:15px;padding-top:13px;display:flex;align-items:center;gap:8px;justify-content:space-between;color:#8795a6;font-size:12px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{font-weight:800;font-size:11px;padding:4px 8px;border-radius:7px;background:var(--qbg);color:var(--q)}
.list-panel{margin-top:19px;border-radius:17px;background:white;border:1px solid var(--line);overflow:hidden}.list-top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 22px}.list-top h3{font-size:17px;color:#1b2f4b;margin:0}.list-top p{font-size:12px;color:#8694a7;margin:5px 0 0}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th{background:#f7f9fc;color:#7b8a9c;font-size:12px;white-space:nowrap;padding:12px 19px}td{border-top:1px solid #edf0f5;padding:12px 19px;color:#344157;white-space:nowrap}tr.data-row{cursor:pointer}tr.data-row:hover{background:#f7faff}td strong{color:#223956}.tb-q{display:inline-block;color:var(--q);background:var(--qbg);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800}.number{text-align:right;font-variant-numeric:tabular-nums}.muted{color:#98a3b3}.neg{color:#d15b50;font-weight:750}
.backdrop{position:fixed;inset:0;background:#12213c84;z-index:10;display:none}.backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(490px,100%);z-index:11;background:#fff;transform:translateX(103%);transition:transform .22s ease;box-shadow:-10px 0 45px #0e23412b;overflow:auto}.drawer.show{transform:none}.drawer-top{background:#152b4f;color:#fff;padding:28px 28px 24px}.drawer-top .back{border:0;background:#ffffff24;color:#fff;border-radius:8px;padding:6px 11px;float:right}.drawer-top small{letter-spacing:.1em;color:#aed2f5}.drawer-top h2{font-size:27px;margin:13px 0 8px}.drawer-top p{font-size:13px;color:#c7d9ef;margin:0}.drawer-content{padding:26px}.drawer-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drawer-summary .stat{padding:14px}.drawer-summary .stat strong{font-size:22px}.sect-title{font-size:15px;font-weight:850;margin:28px 0 13px;color:#263b58}.factory{border:1px solid #e7edf4;border-radius:13px;padding:16px;margin:11px 0}.factory-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:850}.factory small{font-size:11px;color:#98a4b4}.factory-lines{display:grid;grid-template-columns:1fr auto;gap:9px;font-size:12px;color:#738096;margin-top:15px}.factory-lines b{color:#263b58}.factory-lines b.neg{color:#d15b50}
.notice{padding:15px 18px;border-radius:10px;background:#f6f8fc;color:#748299;font-size:12px;line-height:1.8;margin-top:18px}.err{padding:20px;background:#fff5f3;border:1px solid #efc4c0;border-radius:12px;color:#ad392f}.loading{color:#718096;margin:20px 0;text-align:center}.footer{font-size:11px;color:#9caabe;margin-top:22px;text-align:center}
@media (max-width:1000px){.shell{padding:24px 20px 45px}.dashboard{grid-template-columns:1fr}.quad-grid{min-height:495px}.quad{min-height:245px}.stats{grid-template-columns:repeat(2,1fr)}}@media (max-width:600px){.shell{padding:12px 9px 35px}header{padding:22px 20px;border-radius:15px}.stats{gap:8px}.stat{padding:13px 14px;border-radius:12px}.stat strong{font-size:26px}.toolbar{padding:12px;display:block}.search{margin-top:12px;width:100%}.panel{padding:14px;border-radius:13px}.quad-grid{min-height:440px}.quad{min-height:215px}.quad .qh{padding:10px 7px;font-size:11px}.dot .name{font-size:10px}.dot .circle{width:10px;height:10px}.quad-layout{grid-template-columns:24px 1fr}.yaxis{font-size:10px}.xaxis{font-size:10px}.single .quad-grid{min-height:510px}.single .quad{min-height:250px}.region-foot{display:block}.pills{margin-top:9px}td,th{padding:11px 12px}.legend{margin-top:12px}}

/* Factory-focused chart refinements */
.plot-wrap{display:grid;grid-template-columns:53px minmax(0,1fr);gap:9px}
.y-axis{display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#596c86;font-size:11px;font-weight:750;padding:18px 0 14px;gap:13px}
.y-axis .axis-name{writing-mode:vertical-rl;transform:none;letter-spacing:.15em;color:#263f61;font-size:12px}
.y-axis .axis-end{writing-mode:horizontal-tb;white-space:nowrap;font-size:10px}
.x-axis{margin:8px 0 0 62px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#6e7e92;font-size:11px}
.x-axis b{font-size:12px;color:#344d70}
.quad-grid{grid-column:auto;min-height:510px}
.quad{min-height:250px}
.quad .qh{font-size:12px;padding:12px 11px;justify-content:flex-start}
.quad .qh span{white-space:normal;line-height:1.35}
.dot{min-width:72px;max-width:130px;padding:3px 5px;transform:translate(-50%,-25%)}
.dot:hover{transform:translate(-50%,-30%)}
.dot .name{max-width:130px;font-size:11px;line-height:1.25;overflow-wrap:anywhere}
.dot .office-inline{font-size:10px;font-weight:500;color:#687d94}
.single .quad-grid{min-height:650px}.single .quad{min-height:320px}
@media(max-width:600px){.plot-wrap{grid-template-columns:30px minmax(0,1fr);gap:3px}.x-axis{margin-left:34px}.quad-grid{min-height:460px}.quad{min-height:226px}.dot{min-width:50px;max-width:94px}.dot .name{font-size:9px;max-width:94px}.dot .office-inline{font-size:9px}.quad .qh{font-size:10px;padding:9px 5px}.y-axis .axis-name{font-size:10px}.y-axis .axis-end{font-size:9px}.single .quad-grid{min-height:520px}.single .quad{min-height:255px}}

/* Strong, readable quadrant headings: label + factory count stay together */
.quad .qh{font-size:clamp(16px,1.45vw,20px);font-weight:900;padding:16px 17px;line-height:1.35;letter-spacing:.01em;position:relative;z-index:3}
.quad .qh span{white-space:normal;overflow-wrap:anywhere;line-height:1.35;text-shadow:0 1px 0 #fff9}
.single .quad .qh{font-size:clamp(19px,1.8vw,24px);padding:19px 22px}
@media(max-width:600px){
 .quad .qh{font-size:clamp(13px,3.4vw,17px);padding:11px 8px;line-height:1.4}
 .single .quad .qh{font-size:clamp(14px,3.7vw,19px);padding:13px 10px}
}
</style>
</head>
<body>
<div class="shell">
<header><div class="kicker">WORKSITE PERFORMANCE INTELLIGENCE</div><div class="headrow"><div><h1>TSMC 職域考核預警</h1><p>區域中心 × 廠區｜四象限分布與考核明細</p></div><div class="head-tag"><span class="pulse"></span><span id="sync-pill">讀取資料中</span></div></div></header>
<div class="topline"><h2>整體考核概覽</h2><span class="update" id="updated">—</span></div>
<div class="stats" id="stats"><div class="loading">資料載入中…</div></div>
<div class="toolbar"><div class="tabs" id="tabs"></div><input class="search" id="search" aria-label="搜尋通訊處或廠區" placeholder="搜尋通訊處／業務區／廠區"></div>
<p class="explain">每個點代表一個廠區，名稱為「廠區（通訊處）」。象限依 Excel 原始分類；點位依實際績效與未達標差距安排，略做避讓以提升辨識度，不能直接解讀為精確達標率。</p>
<main id="dashboard" class="dashboard"></main>
<section class="list-panel"><div class="list-top"><div><h3>廠區明細</h3><p id="list-note">直接使用原始廠區考核資料</p></div><span id="rowcount" class="update"></span></div><div class="table-wrap"><table><thead><tr><th>區域中心</th><th>廠區（通訊處）</th><th>FYC 實績</th><th>FYC 差額</th><th>新客戶數</th><th>新客戶數差額</th><th>象限</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="footer">資料來源：指定 Google Drive 試算表｜考核計算以原始「象限」欄位及差額欄位為準。公開網頁請勿放置個人身分資料。</div>
</div>
<div id="backdrop" class="backdrop" tabindex="-1"></div><aside id="drawer" class="drawer" aria-label="通訊處明細" aria-modal="true" role="dialog"></aside>
<script src="./app.js" defer></script>
</body></html>
